<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tuition Fee Tracker</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.header {
    background: #111827;
    color: white;
    padding: 25px 20px;
    border-radius: 18px;
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 27px;
}

.header p {
    margin: 0;
    opacity: .8;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.stat {
    background: white;
    padding: 15px 8px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 2px 8px #00000012;
}

.stat h2 {
    margin: 0 0 5px;
    font-size: 20px;
}

.stat p {
    margin: 0;
    font-size: 11px;
    color: #666;
}

.total-box {
    background: white;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: 0 2px 8px #00000012;
}

.total-box h2 {
    margin: 0;
    font-size: 25px;
}

.total-box p {
    margin: 5px 0 0;
    color: #666;
}

.student {
    background: white;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px #00000010;
}

.name {
    font-weight: bold;
}

.status {
    font-size: 12px;
    margin-top: 4px;
}

.paid {
    color: #16803c;
}

.pending {
    color: #d62828;
}

.amount {
    font-size: 13px;
    color: #666;
    margin-top: 3px;
}

button {
    border: none;
    padding: 9px 12px;
    border-radius: 9px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.pay-btn {
    background: #16a34a;
}

.pending-btn {
    background: #dc2626;
}

.admin-box {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-top: 20px;
    box-shadow: 0 2px 8px #00000012;
}

.admin-box h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 14px;
}

.login-btn {
    width: 100%;
    background: #2563eb;
    margin-top: 5px;
}

.logout-btn {
    width: 100%;
    background: #374151;
    margin-top: 10px;
}

.admin-status {
    font-size: 13px;
    color: #16803c;
    margin-bottom: 10px;
}

.hidden {
    display: none;
}

.error {
    color: #dc2626;
    font-size: 13px;
    margin-top: 8px;
}

.info {
    color: #555;
    font-size: 13px;
    line-height: 1.5;
}

@media(max-width:400px) {

    .container {
        padding: 14px;
    }

    .student {
        padding: 12px;
    }

    button {
        padding: 8px 9px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Tuition Fee Tracker</h1>
        <p>Monthly Tuition Fee: ₹3,000</p>
    </div>

    <div class="stats">

        <div class="stat">
            <h2 id="totalStudents">0</h2>
            <p>Total Students</p>
        </div>

        <div class="stat">
            <h2 id="paidCount">0</h2>
            <p>Paid</p>
        </div>

        <div class="stat">
            <h2 id="pendingCount">0</h2>
            <p>Pending</p>
        </div>

    </div>

    <div class="total-box">
        <h2 id="totalCollected">₹0</h2>
        <p>Total Collected</p>
    </div>

    <div id="studentList"></div>


    <!-- ADMIN PANEL -->

    <div class="admin-box">

        <h2>🔐 Admin Panel</h2>

        <div id="loginArea">

            <p class="info">
                Admin login is required to change payment status.
            </p>

            <input
                type="email"
                id="email"
                placeholder="Admin Email"
                autocomplete="email"
            >

            <input
                type="password"
                id="password"
                placeholder="Admin Password"
                autocomplete="current-password"
            >

            <button
                class="login-btn"
                onclick="adminLogin()">
                Admin Login
            </button>

            <div id="loginMessage"></div>

        </div>


        <div id="adminArea" class="hidden">

            <div class="admin-status">
                ✅ Admin logged in
            </div>

            <p class="info">
                You can now mark students as Paid or Pending.
            </p>

            <button
                class="logout-btn"
                onclick="adminLogout()">
                Logout
            </button>

        </div>

    </div>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORTS
   ========================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue,
    set
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================================
   YOUR FIREBASE CONFIG
   ========================================= */

const firebaseConfig = {

    apiKey: "AIzaSyBXtVsYccRYB6iYEjGohuEeR_qcG92V6WQ",

    authDomain:
        "fees-tracker-ec6b7.firebaseapp.com",

    databaseURL:
        "https://fees-tracker-ec6b7-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "fees-tracker-ec6b7",

    storageBucket:
        "fees-tracker-ec6b7.firebasestorage.app",

    messagingSenderId:
        "747455744050",

    appId:
        "1:747455744050:web:ca2ef03e96f34e9c79542b",

    measurementId:
        "G-WT9VJD6KRY"
};


/* =========================================
   INITIALIZE FIREBASE
   ========================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =========================================
   SETTINGS
   ========================================= */

const feeAmount = 3000;


/*
   IMPORTANT:
   Put your Firebase ADMIN USER UID here.
*/

const adminUID =
    "ZDASbUxS3UOgOuC0ayhwCbMC6LC2";


/* =========================================
   STUDENT LIST
   ========================================= */

const students = [

    "Ridhima",
    "Rohan",
    "Raunak",
    "Dev Gangster",
    "Rajdeep",
    "Rohit Chudasia",
    "Slok",
    "Piyush",
    "Chandrima",
    "Jasmeet Singh",
    "Anindita",
    "OM bro",
    "Aritra",
    "Akhilesh"

];


/* =========================================
   VARIABLES
   ========================================= */

let paymentStatus = {};

let isAdmin = false;


/* =========================================
   REAL-TIME DATABASE
   ========================================= */

const paymentsRef =
    ref(db, "tuitionPayments");


onValue(paymentsRef, (snapshot) => {

    paymentStatus =
        snapshot.val() || {};

    renderStudents();

});


/* =========================================
   DISPLAY STUDENTS
   ========================================= */

function renderStudents() {

    const list =
        document.getElementById("studentList");

    list.innerHTML = "";

    let paid = 0;


    students.forEach((name, index) => {

        const isPaid =
            paymentStatus[index] === true;


        if (isPaid) {
            paid++;
        }


        const div =
            document.createElement("div");

        div.className = "student";


        div.innerHTML = `

            <div>

                <div class="name">
                    ${name}
                </div>

                <div class="status ${
                    isPaid ? "paid" : "pending"
                }">

                    ${
                        isPaid
                        ? "✓ Paid"
                        : "✕ Pending"
                    }

                </div>

                <div class="amount">

                    Fee: ₹${feeAmount.toLocaleString("en-IN")}

                </div>

            </div>


            ${
                isAdmin

                ?

                `<button
                    class="${
                        isPaid
                        ? "pending-btn"
                        : "pay-btn"
                    }"
                    onclick="togglePayment(${index})">

                    ${
                        isPaid
                        ? "Mark Pending"
                        : "Mark Paid"
                    }

                </button>`

                : ""
            }

        `;


        list.appendChild(div);

    });


    /* =========================================
       UPDATE STATISTICS
       ========================================= */

    document.getElementById(
        "totalStudents"
    ).textContent =
        students.length;


    document.getElementById(
        "paidCount"
    ).textContent =
        paid;


    document.getElementById(
        "pendingCount"
    ).textContent =
        students.length - paid;


    document.getElementById(
        "totalCollected"
    ).textContent =
        "₹" +
        (paid * feeAmount)
        .toLocaleString("en-IN");

}


/* =========================================
   MARK PAID / PENDING
   ========================================= */

window.togglePayment =
async function(index) {

    if (!isAdmin) {

        alert(
            "Admin login required."
        );

        return;
    }


    const newStatus =
        !paymentStatus[index];


    try {

        await set(
            ref(
                db,
                "tuitionPayments/" + index
            ),
            newStatus
        );

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not update payment status."
        );

    }

};


/* =========================================
   ADMIN LOGIN
   ========================================= */

window.adminLogin =
async function() {

    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    message.className = "";


    if (!email || !password) {

        message.className =
            "error";

        message.textContent =
            "Please enter email and password.";

        return;
    }


    try {

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        /*
           Extra safety check:
           only the specified UID
           is allowed to become admin.
        */

        if (result.user.uid !== adminUID) {

            await signOut(auth);

            message.className =
                "error";

            message.textContent =
                "This account is not authorized as admin.";

            return;
        }


        message.textContent = "";

    }

    catch (error) {

        console.error(error);

        message.className =
            "error";

        message.textContent =
            "Login failed. Check your email and password.";

    }

};


/* =========================================
   ADMIN LOGOUT
   ========================================= */

window.adminLogout =
async function() {

    try {

        await signOut(auth);

    }

    catch (error) {

        console.error(error);

    }

};


/* =========================================
   AUTH STATE
   ========================================= */

onAuthStateChanged(
    auth,
    (user) => {

        if (
            user &&
            user.uid === adminUID
        ) {

            isAdmin = true;


            document.getElementById(
                "loginArea"
            ).classList.add("hidden");


            document.getElementById(
                "adminArea"
            ).classList.remove("hidden");

        }

        else {

            isAdmin = false;


            document.getElementById(
                "loginArea"
            ).classList.remove("hidden");


            document.getElementById(
                "adminArea"
            ).classList.add("hidden");

        }


        renderStudents();

    }
);

</script>

</body>
</html>
